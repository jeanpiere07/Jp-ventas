<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#111;color:white;text-align:center;padding:24px 16px}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#ccc}
.container{max-width:900px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0001}
.card img{width:100%;height:210px;object-fit:cover;background:#ddd}
.info{padding:14px}
.name{font-size:20px;font-weight:bold;margin:0 0 8px}
.price{font-size:18px;font-weight:bold;margin:0 0 8px}
.stock{font-size:15px;margin:0}
.available{color:#17833b}
</style>
</head>
<body>
<header>
  <h1>🛍️ MI TIENDA</h1>
  <p>Productos disponibles</p>
</header>

<div class="container">
  <div class="grid">
    <div class="card">
      <img src="[https://estacioncaramelo.cl/wp-content/uploads/2021/08/Tronquito.png](https://estacioncaramelo.cl/wp-content/uploads/2021/08/Tronquito.png)" alt="troquito fruna 20g">
      <div class="info">
        <p class="name">troquito fruna 20g</p>
        <p class="price">$200</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>

    <div class="card">
      <img src="[https://candymarket.cl/cdn/shop/files/coyac-bowling.jpg](https://candymarket.cl/cdn/shop/files/coyac-bowling.jpg)" alt="coyac bowling unidad">
      <div class="info">
        <p class="name">coyac bowling unidad</p>
        <p class="price">$200</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>

    <div class="card">
      <img src="[https://fruna.cl/wp-content/uploads/2020/06/twingo.png](https://fruna.cl/wp-content/uploads/2020/06/twingo.png)" alt="alfajor twingo">
      <div class="info">
        <p class="name">alfajor twingo</p>
        <p class="price">$200</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>

    <div class="card">
      <img src="[https://m.media-amazon.com/images/I/51v8G2m5W8L._SL1500_.jpg](https://m.media-amazon.com/images/I/51v8G2m5W8L._SL1500_.jpg)" alt="Coca-Cola 250ml">
      <div class="info">
        <p class="name">Coca-Cola 250ml</p>
        <p class="price">$600</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
