<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#111;color:white;text-align:center;padding:24px 16px}
header h1{margin:0;font-size:28px}
header p{margin:7px 0 0;color:#ccc}
.container{max-width:900px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0001}
.card img{width:100%;height:210px;object-fit:cover;background:#ddd}
.info{padding:14px}
.name{font-size:20px;font-weight:bold;margin:0 0 8px}
.price{font-size:18px;font-weight:bold;margin:0 0 8px}
.stock{font-size:15px;margin:0}
.available{color:#17833b}
</style>
</head>
<body>
<header>
  <h1>🛍️ MI TIENDA</h1>
  <p>Productos disponibles</p>
</header>

<div class="container">
  <div class="grid">
    <div class="card">
      <img src="https://placehold.co/600x500?text=Producto+1" alt="Producto 1">
      <div class="info">
        <p class="name">Producto 1</p>
        <p class="price">$200</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>

    <div class="card">
      <img src="https://placehold.co/600x500?text=Producto+2" alt="Producto 2">
      <div class="info">
        <p class="name">Producto 2</p>
        <p class="price">$200</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>

    <div class="card">
      <img src="https://placehold.co/600x500?text=Producto+3" alt="Producto 3">
      <div class="info">
        <p class="name">Producto 3</p>
        <p class="price">$200</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>

    <div class="card">
      <img src="https://placehold.co/600x500?text=Producto+4" alt="Producto 4">
      <div class="info">
        <p class="name">Producto 4</p>
        <p class="price">$600</p>
        <p class="stock available">🟢 Disponible</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
